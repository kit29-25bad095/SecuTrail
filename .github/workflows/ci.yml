name: SecuTrail Production CI & Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run ESLint
      run: npm run lint

    - name: Run TypeScript typecheck
      run: npx tsc --noEmit

    - name: Run automated test suites
      run: npm test

    - name: Run production build
      run: npm run build
      env:
        NEXT_PUBLIC_APP_URL: "https://secutrail.org"
        NEXT_PUBLIC_APP_NAME: "SecuTrail"
        NEXT_PUBLIC_QUICK_EXIT_URL: "https://www.google.com"
        NEXT_PUBLIC_ENABLE_DEMO_MODE: "true"
        RESOURCE_PROVIDER: "demo"
        LLM_PROVIDER: "mock"
